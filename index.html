<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Cell Grind — Excel Esports Manager</title>
<meta name="description" content="Manage an Excel esports pro: balance training, running, cross training, sleep and relaxation across 24 hours a day to become the world's best." />

<!-- iOS home-screen / PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cell Grind" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1220" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="topbar-top">
      <div class="brand">Cell Grind</div>
      <div class="topbar-right">
        <button class="icon-btn" id="leaguesBtn" title="Leagues" aria-label="Leagues">🏅</button>
        <button class="chip" id="cashChip" title="Cash">💰 <span id="cashVal">0</span></button>
        <button class="chip" id="rankChip" title="Rating">🏆 <span id="rankVal">800</span></button>
        <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      </div>
    </div>
    <div class="topbar-info">
      <div class="match-counter" id="matchCounter">Y1 · League 5 · Preseason · Season starts in 14 days</div>
      <div class="topbar-sub-row">
        <div class="match-counter match-counter-sub" id="matchCounter2"></div>
        <div class="hours-left topbar-hours">Unassigned: <span id="hoursLeft">24</span>h<span id="hoursCapNote" class="hours-cap-note"></span></div>
      </div>
    </div>
  </header>

  <div id="warningBanner" class="warning-banner hidden"></div>

  <!-- ===== Time allocation ===== -->
  <section class="planner">
    <div class="planner-header">
      <h2>Plan Your Day</h2>
    </div>

    <div id="plannerRows"><!-- skill + exercise/sleep/relax rows, each combining its stat readout and slider, rendered by renderPlanner() --></div>

    <div class="end-day-row">
      <button class="end-day-btn" id="endDayBtn">End Day ▶</button>
      <button class="end-day-btn end-week-btn" id="endWeekBtn">To Match ▶▶</button>
    </div>
    <div class="end-day-hint" id="endDayHint"></div>
  </section>

  <!-- ===== Log ===== -->
  <section class="log-section">
    <div class="log-head"><h2>Log</h2><button class="link-btn" id="historyLink">📜 Match history ›</button></div>
    <div id="log" class="log"></div>
  </section>

</div>

<div id="saveToast" class="save-toast hidden"></div>

<!-- ===== Modal: generic ===== -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
